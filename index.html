      <script>
        // Compatibility fix for browser extensions attempting to assign to window.fetch
        (function() {
          try {
            var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}

          window.addEventListener('error', function(event) {
            if (event && (
              (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
              (event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1)
            )) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        })();
      </script>
  </head>
